name: Weekly price update
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_data.py
      - run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/cards.json; git diff --staged --quiet || git commit -m "Weekly price update" && git push
