<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Tracker</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14151a"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14151a;--panel:#1f2128;--line:#2c2f39;--text:#eceef3;--mute:#9298a8;--acc:#f5b942;--ok:#3ecf8e;--bad:#ef6a6a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--panel:#fff;--line:#dfe2ea;--text:#1a1c23;--mute:#667;--acc:#c98a0a;--ok:#14975a;--bad:#d44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}h1 small{font-size:12px;color:var(--mute);font-weight:400}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip,select,input[type=search]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;white-space:nowrap}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
input[type=search]{width:100%;border-radius:10px;margin-bottom:8px}select{border-radius:10px}
.stats{padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:17px}.stat span{color:var(--mute);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 16px 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block;background:var(--line);transition:.15s}
.card:not(.own) img{filter:grayscale(1) opacity(.45)}
.card.own{border-color:var(--ok)}
.tick{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;font-weight:700}
.own .tick{background:var(--ok);color:#000}
.info{padding:8px;font-size:12px;line-height:1.35}.info .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .m{color:var(--mute)}.price{font-weight:700;color:var(--acc);font-size:14px}.up{color:var(--ok)}.dn{color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:3px;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:inherit;font-weight:600}nav button.on{color:var(--acc)}
.acct{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin:-4px 0 8px;gap:8px}.acct button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:inherit}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}.modal form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:340px;display:grid;gap:10px}.modal input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.modal .go{background:var(--acc);color:#000;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700}.modal .lnk{background:none;border:0;color:var(--mute);font:inherit}.err{color:var(--bad);font-size:13px;min-height:1em}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.sum{padding:0 16px 8px;color:var(--mute);font-size:13px}
.tools{display:flex;gap:8px;padding:8px 16px}.tools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
</style></head><body>
<header>
 <h1>Card Tracker <small id="upd"></small></h1>
 <div class="acct" id="acct"></div>
 <div class="row" id="games"></div>
 <div class="row" id="langs"></div>
 <div class="row" id="chars"></div>
 <input type="search" id="q" placeholder="Search name, set, number…">
 <div class="row"><select id="typ"><option value="">Regular + Promo</option><option value="promo">Promo only</option><option value="reg">Regular only</option></select><select id="rar"></select><select id="fin"></select><select id="sort">
  <option value="price-d">Price ↓</option><option value="price-a">Price ↑</option><option value="num">Number</option><option value="chg">Price change</option></select></div>
</header>
<div class="stats" id="stats"></div><div class="bar"><i id="pb"></i></div>
<div class="sum" id="sum"></div>
<div class="grid" id="grid"></div>
<div class="tools"><button id="exp">Export collection</button><button id="imp">Import</button></div>
<nav><button data-v="all" class="on">All</button><button data-v="need">Need to buy</button><button data-v="own">Owned</button></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const LS='cardtracker.owned.v1';let owned={};
try{owned=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(owned))}catch(e){}};
let sb=null,user=null;
try{if(window.SUPABASE_URL&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
async function pull(){ // merge local + cloud, push local-only cards up
 const {data,error}=await sb.from('owned_cards').select('card_id').limit(10000);if(error)return alert('Sync failed: '+error.message);
 const cloud=new Set(data.map(r=>r.card_id)),up=Object.keys(owned).filter(k=>!cloud.has(k));
 if(up.length)await sb.from('owned_cards').insert(up.map(card_id=>({card_id})));
 cloud.forEach(k=>owned[k]=1);save();render()}
function acct(){const a=$('acct');
 if(!sb){a.innerHTML='<span>Saved on this device only</span>';return}
 a.innerHTML=user?`<span>${user.email} · synced</span><button id="so">Log out</button>`:'<span>Log in to save across devices</span><button id="li">Log in</button>';
 if($('so'))$('so').onclick=async()=>{await sb.auth.signOut();owned={};save();render()};
 if($('li'))$('li').onclick=loginForm}
function loginForm(){const m=document.createElement('div');m.className='modal';
 m.innerHTML='<form><b>Log in / Sign up</b><input type="email" id="em" placeholder="Email" autocomplete="email" required><input type="password" id="pw" placeholder="Password (6+ chars)" autocomplete="current-password" required minlength="6"><div class="err" id="er"></div><button class="go" id="in">Log in</button><button type="button" class="lnk" id="su">Create account</button><button type="button" class="lnk" id="cx">Cancel</button></form>';
 document.body.append(m);const er=m.querySelector('#er');
 const run=async up=>{const c={email:m.querySelector('#em').value,password:m.querySelector('#pw').value};
  const {data,error}=await(up?sb.auth.signUp(c):sb.auth.signInWithPassword(c));
  if(error)return er.textContent=error.message;
  if(up&&!data.session)return er.textContent='Check your email to confirm, then log in.';m.remove()};
 m.querySelector('form').onsubmit=e=>{e.preventDefault();run(false)};m.querySelector('#su').onclick=()=>run(true);m.querySelector('#cx').onclick=()=>m.remove()}
if(sb)sb.auth.onAuthStateChange((ev,s)=>{user=s?s.user:null;acct();if(user&&DATA)pull()});
function persist(id,on){save();if(sb&&user)(on?sb.from('owned_cards').upsert({card_id:id}):sb.from('owned_cards').delete().eq('card_id',id)).then(r=>r.error&&alert('Sync failed: '+r.error.message))}
const S={game:'all',char:'all',lang:'all',view:'all'};let DATA=null;
const $=id=>document.getElementById(id);
const RATE={USD:1,EUR:1.08,JPY:0.0066}; // approximate, only used for totals
const usd=c=>(c.price||0)*(RATE[c.currency]||1);
const money=(p,c)=>p==null?'—':c==='JPY'?'¥'+Math.round(p).toLocaleString():(c==='EUR'?'€':'$')+p.toFixed(2);
const GN={onepiece:'One Piece',pokemon:'Pokémon'};
function chips(el,items,key){el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+(S[key]===v?' on':'');b.textContent=l;b.onclick=()=>{S[key]=v;if(key==='game')S.char='all';render()};el.append(b)})}
function opts(el,label,vals){const cur=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${v}</option>`).join('');el.value=vals.includes(cur)?cur:''}
function render(){
 const all=DATA.cards;
 chips($('langs'),[['all','EN + JP'],['EN','English'],['JP','Japanese']],'lang');
 chips($('games'),[['all','All games'],...Object.entries(GN)],'game');
 const chs=[...new Set(all.filter(c=>S.game==='all'||c.game===S.game).map(c=>c.character))];
 chips($('chars'),[['all','All characters'],...chs.map(c=>[c,c])],'char');
 let base=all.filter(c=>(S.game==='all'||c.game===S.game)&&(S.char==='all'||c.character===S.char)&&(S.lang==='all'||c.lang===S.lang));
 opts($('rar'),'Rarity',[...new Set(base.map(c=>c.rarity))].sort());
 opts($('fin'),'Finish',[...new Set(base.map(c=>c.finish))].sort());
 const q=$('q').value.toLowerCase();
 base=base.filter(c=>(!$('typ').value||($('typ').value==='promo')===c.promo)&&(!$('rar').value||c.rarity===$('rar').value)&&(!$('fin').value||c.finish===$('fin').value)&&(!q||(c.name+c.set+c.number+c.rarity).toLowerCase().includes(q)));
 const own=base.filter(c=>owned[c.id]),need=base.filter(c=>!owned[c.id]);
 const sum=a=>a.reduce((t,c)=>t+usd(c),0);
 $('stats').innerHTML=`<div class="stat"><b>${own.length}/${base.length}</b><span>Owned</span></div><div class="stat"><b>~$${sum(own).toFixed(0)}</b><span>Collection value</span></div><div class="stat"><b>~$${sum(need).toFixed(0)}</b><span>To complete</span></div>`;
 $('pb').style.width=(base.length?own.length/base.length*100:0)+'%';
 let list=S.view==='own'?own:S.view==='need'?need:base;
 const so=$('sort').value,chg=c=>c.prev_price&&c.price?c.price-c.prev_price:0;
 list=[...list].sort((a,b)=>so==='price-a'?usd(a)-usd(b):so==='num'?a.number.localeCompare(b.number,undefined,{numeric:true}):so==='chg'?Math.abs(chg(b))-Math.abs(chg(a)):usd(b)-usd(a));
 $('sum').textContent=`${list.length} cards shown`+(S.view==='need'?` · total ~$${sum(list).toFixed(0)}`:'');
 $('grid').innerHTML=list.length?'':'<div class="empty">No cards match.</div>';
 for(const c of list){
  const d=chg(c),el=document.createElement('div');el.className='card'+(owned[c.id]?' own':'');
  el.innerHTML=`<img loading="lazy" referrerpolicy="no-referrer" src="${c.image}" alt=""><div class="tick">${owned[c.id]?'✓':'+'}</div><div class="info"><div class="n">${c.character}${c.variant!=='Standard'?' · '+c.variant:''}</div><div class="m">${c.number} · ${c.set}</div><div class="m"><span class="tag">${c.lang}</span>${c.promo?'<span class="tag">Promo</span>':''}<span class="tag">${c.rarity}</span><span class="tag">${c.finish}</span></div><div class="price">${money(c.price,c.currency)} ${d?`<small class="${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d).toFixed(2)}</small>`:''}</div></div>`;
  el.onclick=()=>{const on=!owned[c.id];on?owned[c.id]=1:delete owned[c.id];persist(c.id,on);render()};
  $('grid').append(el)}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
['q','typ','rar','fin','sort'].forEach(i=>$(i).oninput=render);
$('exp').onclick=()=>{const t=JSON.stringify(Object.keys(owned));navigator.clipboard?.writeText(t).then(()=>alert('Collection copied to clipboard.'),()=>prompt('Copy:',t))||prompt('Copy:',t)};
$('imp').onclick=()=>{const t=prompt('Paste exported collection:');if(!t)return;try{JSON.parse(t).forEach(k=>owned[k]=1);save();render()}catch(e){alert('Invalid data')}};
fetch('data/cards.json').then(r=>r.json()).then(d=>{DATA=d;$('upd').textContent='prices '+d.updated;acct();render();if(user)pull()}).catch(()=>$('grid').innerHTML='<div class="empty">Could not load data/cards.json</div>');
</script></body></html>
