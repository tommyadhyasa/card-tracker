<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Tracker</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14151a"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14151a;--panel:#1f2128;--line:#2c2f39;--text:#eceef3;--mute:#9298a8;--acc:#f5b942;--ok:#3ecf8e;--bad:#ef6a6a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--panel:#fff;--line:#dfe2ea;--text:#1a1c23;--mute:#667;--acc:#c98a0a;--ok:#14975a;--bad:#d44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}h1 small{font-size:12px;color:var(--mute);font-weight:400}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip,select,input[type=search]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;white-space:nowrap}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
input[type=search]{width:100%;border-radius:10px;margin-bottom:8px}select{border-radius:10px}
.stats{padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:17px}.stat span{color:var(--mute);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 16px 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block;background:var(--line);transition:.15s}
.card:not(.own) img{filter:grayscale(1) opacity(.45)}
.card.own{border-color:var(--ok)}
.tick{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;font-weight:700}
.own .tick{background:var(--ok);color:#000}
.info{padding:8px;font-size:12px;line-height:1.35}.info .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .m{color:var(--mute)}.price{font-weight:700;color:var(--acc);font-size:14px}.up{color:var(--ok)}.dn{color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:3px;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:inherit;font-weight:600}nav button.on{color:var(--acc)}
.acct{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin:-4px 0 8px;gap:8px}.acct button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:inherit}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}.modal form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:340px;display:grid;gap:10px}.modal input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.modal .go{background:var(--acc);color:#000;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700}.modal .lnk{background:none;border:0;color:var(--mute);font:inherit}.err{color:var(--bad);font-size:13px;min-height:1em}
#savebar{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 4px 16px #0006}
#savebar[hidden]{display:none}#savebar span{flex:1}#savebar button{border-radius:9px;padding:8px 14px;font:inherit;font-weight:700;border:1px solid var(--line);background:none;color:var(--text)}#savebar .go{background:var(--acc);color:#000;border:0}
.grid{padding-bottom:130px}
.modal .mu{color:var(--mute);font-size:13px}.modal .pay{display:flex;gap:8px}.modal .pay input{flex:1;min-width:0}.modal select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.sum{padding:0 16px 8px;color:var(--mute);font-size:13px}
</style></head><body>
<header>
 <h1>Card Tracker <small id="upd"></small></h1>
 <div class="acct" id="acct"></div>
 <div class="row" id="games"></div>
 <div class="row" id="langs"></div>
 <div class="row" id="chars"></div>
 <input type="search" id="q" placeholder="Search name, set, number…">
 <div class="row"><select id="typ"><option value="">Regular + Promo</option><option value="promo">Promo only</option><option value="reg">Regular only</option></select><select id="rar"></select><select id="fin"></select><select id="sort">
  <option value="price-d">Price ↓</option><option value="price-a">Price ↑</option><option value="num">Number</option><option value="chg">Price change</option></select></div>
</header>
<div class="stats" id="stats"></div><div class="bar"><i id="pb"></i></div>
<div class="sum" id="sum"></div>
<div class="grid" id="grid"></div>
<div id="savebar" hidden><span id="sbtxt"></span><button id="sbx">Discard</button><button id="sbs" class="go">Save</button></div>
<nav><button data-v="all" class="on">All</button><button data-v="need">Need to buy</button><button data-v="own">Owned</button></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const LS='cardtracker.owned.v1';let owned={};
try{owned=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const LP='cardtracker.paid.v1';let paid={}; // paid[cardId]={p:price,c:'IDR'|'JPY'|'USD'}
try{paid=JSON.parse(localStorage.getItem(LP)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(owned));localStorage.setItem(LP,JSON.stringify(paid))}catch(e){}};
let sb=null,user=null;
try{if(window.SUPABASE_URL&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
// Ticking and prices only edit a draft; Save writes it to the database. `cloud`/`cloudPaid` are as last read from / written to the database.
const LB='cardtracker.base.v1';let cloud=null,cloudPaid={},paidOK=true; // paidOK: the table has the price columns
const same=(a,b)=>JSON.stringify(a||null)===JSON.stringify(b||null);
const saveBase=()=>{try{cloud?localStorage.setItem(LB,JSON.stringify({ids:[...cloud],paid:cloudPaid})):localStorage.removeItem(LB)}catch(e){}};
const diff=()=>{const mine=Object.keys(owned),c=cloud||new Set();
 return{add:mine.filter(k=>!c.has(k)),rem:[...c].filter(k=>!owned[k]),chg:paidOK?mine.filter(k=>c.has(k)&&!same(paid[k],cloudPaid[k])):[]}};
const dirty=()=>{if(!(sb&&user&&cloud))return false;const d=diff();return d.add.length+d.rem.length+d.chg.length>0};
async function pull(){ // cloud list + this device's unsaved edits (relative to the list this device last saw)
 const rows=[];paidOK=true;let cols='card_id,paid_price,paid_currency';
 for(let from=0;;from+=1000){
  let {data,error}=await sb.from('owned_cards').select(cols).order('card_id').range(from,from+999);
  if(error&&cols!=='card_id'&&/paid_/.test(error.message)){paidOK=false;cols='card_id';from=-1000;rows.length=0;continue}
  if(error)return alert('Could not load your collection: '+error.message);
  rows.push(...data);if(data.length<1000)break}
 let base=null,basePaid={};try{const b=JSON.parse(localStorage.getItem(LB)||'null');if(b){base=new Set(Array.isArray(b)?b:b.ids);basePaid=Array.isArray(b)?{}:b.paid||{}}}catch(e){}
 const mine=new Set(Object.keys(owned)),merged=new Set(rows.map(r=>r.card_id));
 mine.forEach(k=>{if(!base||!base.has(k))merged.add(k)});
 if(base)base.forEach(k=>{if(!mine.has(k))merged.delete(k)});
 cloudPaid={};rows.forEach(r=>{if(r.paid_price!=null)cloudPaid[r.card_id]={p:+r.paid_price,c:r.paid_currency}});
 const np={};merged.forEach(k=>{const v=same(paid[k],basePaid[k])?cloudPaid[k]:paid[k];if(v)np[k]=v}); // my own price edits win, otherwise the database's
 cloud=new Set(rows.map(r=>r.card_id));saveBase();owned=Object.fromEntries([...merged].map(k=>[k,1]));paid=paidOK?np:paid;save();render()}
function dialog(html,onOk){const m=document.createElement('div');m.className='modal';
 m.innerHTML='<form>'+html+'<button class="go" id="ok">Confirm</button><button type="button" class="lnk" id="cx">Cancel</button></form>';document.body.append(m);
 m.querySelector('#cx').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();m.querySelector('#ok').disabled=true;await onOk(m)};return m}
function updateBar(){const d=dirty()?diff():null,bar=$('savebar');bar.hidden=!d;
 if(d)$('sbtxt').textContent='Unsaved: '+[d.add.length&&'+'+d.add.length+' owned',d.rem.length&&'−'+d.rem.length+' removed',d.chg.length&&d.chg.length+' price edit(s)'].filter(Boolean).join(', ');acct()}
$('sbs').onclick=()=>{const d=diff();dialog(`<b>Save to your account?</b><div>${d.add.length} card(s) marked as owned, ${d.rem.length} card(s) removed${paidOK?`, ${d.chg.length} price edit(s)`:''}.<br>This replaces what is stored in the database.</div>`,async m=>{
 const fail=error=>{m.remove();alert('Save failed: '+error.message+'\nNothing was lost on this device; try again.')};
 const up=paidOK?[...d.add,...d.chg].map(k=>({user_id:user.id,card_id:k,paid_price:paid[k]?paid[k].p:null,paid_currency:paid[k]?paid[k].c:null})):d.add.map(card_id=>({card_id}));
 for(let i=0;i<up.length;i+=500){const {error}=await sb.from('owned_cards').upsert(up.slice(i,i+500),paidOK?{onConflict:'user_id,card_id'}:{ignoreDuplicates:true});if(error)return fail(error)}
 for(let i=0;i<d.rem.length;i+=500){const {error}=await sb.from('owned_cards').delete().in('card_id',d.rem.slice(i,i+500));if(error)return fail(error)}
 cloud=new Set(Object.keys(owned));cloudPaid=paidOK?JSON.parse(JSON.stringify(paid)):{};saveBase();updateBar();
 m.querySelector('form').innerHTML='<b>Saved ✓</b><div>Your collection is stored in the database.</div>';setTimeout(()=>m.remove(),1200)})};
$('sbx').onclick=()=>dialog('<b>Discard unsaved changes?</b><div>Your collection and prices go back to the last saved version.</div>',async m=>{owned=Object.fromEntries([...cloud].map(k=>[k,1]));paid=JSON.parse(JSON.stringify(cloudPaid));save();m.remove();render()});
const CUR={IDR:'Rp',JPY:'¥',USD:'$'},fmtPaid=v=>v?`${CUR[v.c]||''}${v.c==='USD'?v.p.toFixed(2):Math.round(v.p).toLocaleString(v.c==='IDR'?'id-ID':'en-US')}`:'';
function cardModal(c){ // owned card: record what it cost, or remove it
 const v=paid[c.id],def={EN:'USD',JP:'JPY',ID:'IDR'}[c.lang]||'USD',m=document.createElement('div');m.className='modal';
 m.innerHTML=`<form><b>${c.character} · ${c.name}</b><div class="mu">${c.number} · ${c.set} · ${c.lang}${c.variant!=='Standard'?' · '+c.variant:''}</div>
  <label class="mu">What did you pay?</label><div class="pay"><input type="number" id="pp" inputmode="decimal" min="0" step="any" placeholder="Price" value="${v?v.p:''}"><select id="pc">${['IDR','JPY','USD'].map(x=>`<option${x===(v?v.c:def)?' selected':''}>${x}</option>`).join('')}</select></div>
  <div class="mu">${paidOK||!sb||!user?'':'The database has no price columns yet, so prices are kept on this device only (run the updated supabase.sql).'}</div>
  <button class="go">Save price</button><button type="button" class="lnk" id="cl">Clear price</button><button type="button" class="lnk" id="rm">Remove from my collection</button><button type="button" class="lnk" id="cx">Close</button></form>`;
 document.body.append(m);const done=()=>{m.remove();save();render()};
 m.querySelector('#cx').onclick=()=>m.remove();
 m.querySelector('#cl').onclick=()=>{delete paid[c.id];done()};
 m.querySelector('#rm').onclick=()=>{delete owned[c.id];delete paid[c.id];done()};
 m.querySelector('form').onsubmit=e=>{e.preventDefault();const p=parseFloat(m.querySelector('#pp').value);
  if(isNaN(p)||p<0)delete paid[c.id];else paid[c.id]={p,c:m.querySelector('#pc').value};done()}}
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
function acct(){const a=$('acct');
 if(!sb){a.innerHTML='<span>Saved on this device only</span>';return}
 a.innerHTML=user?`<span>${user.email} · ${dirty()?'unsaved changes':'saved'}</span><button id="so">Log out</button>`:'<span>Log in to save across devices</span><button id="li">Log in</button>';
 if($('so'))$('so').onclick=()=>{const out=async m=>{await sb.auth.signOut();owned={};paid={};cloud=null;cloudPaid={};save();saveBase();m&&m.remove();render()};dirty()?dialog('<b>Log out with unsaved changes?</b><div>Unsaved changes on this device will be lost.</div>',out):out()};
 if($('li'))$('li').onclick=loginForm}
function loginForm(){const m=document.createElement('div');m.className='modal';
 m.innerHTML='<form><b>Log in / Sign up</b><input type="email" id="em" placeholder="Email" autocomplete="email" required><input type="password" id="pw" placeholder="Password (6+ chars)" autocomplete="current-password" required minlength="6"><div class="err" id="er"></div><button class="go" id="in">Log in</button><button type="button" class="lnk" id="su">Create account</button><button type="button" class="lnk" id="cx">Cancel</button></form>';
 document.body.append(m);const er=m.querySelector('#er');
 const run=async up=>{const c={email:m.querySelector('#em').value,password:m.querySelector('#pw').value};
  const {data,error}=await(up?sb.auth.signUp(c):sb.auth.signInWithPassword(c));
  if(error)return er.textContent=error.message;
  if(up&&!data.session)return er.textContent='Check your email to confirm, then log in.';m.remove()};
 m.querySelector('form').onsubmit=e=>{e.preventDefault();run(false)};m.querySelector('#su').onclick=()=>run(true);m.querySelector('#cx').onclick=()=>m.remove()}
if(sb)sb.auth.onAuthStateChange((ev,s)=>{user=s?s.user:null;acct();if(user&&DATA&&['INITIAL_SESSION','SIGNED_IN'].includes(ev))pull()});
const S={game:'all',char:'all',lang:'all',view:'all'};let DATA=null;
const RATE={USD:1,EUR:1.08,JPY:0.0066,IDR:0.000063}; // approximate, only used for totals
const usd=c=>(c.price||0)*(RATE[c.currency]||1);
const money=(p,c)=>p==null?'—':c==='JPY'?'¥'+Math.round(p).toLocaleString():(c==='EUR'?'€':'$')+p.toFixed(2);
const GN={onepiece:'One Piece',pokemon:'Pokémon'};
function chips(el,items,key){el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+(S[key]===v?' on':'');b.textContent=l;b.onclick=()=>{S[key]=v;if(key==='game')S.char='all';render()};el.append(b)})}
function opts(el,label,vals){const cur=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${v}</option>`).join('');el.value=vals.includes(cur)?cur:''}
function render(){
 const all=DATA.cards;
 chips($('langs'),[['all','All languages'],['EN','English'],['JP','Japanese'],['ID','Indonesian']],'lang');
 chips($('games'),[['all','All games'],...Object.entries(GN)],'game');
 const chs=[...new Set(all.filter(c=>S.game==='all'||c.game===S.game).map(c=>c.character))];
 chips($('chars'),[['all','All characters'],...chs.map(c=>[c,c])],'char');
 let base=all.filter(c=>(S.game==='all'||c.game===S.game)&&(S.char==='all'||c.character===S.char)&&(S.lang==='all'||c.lang===S.lang));
 opts($('rar'),'Rarity',[...new Set(base.map(c=>c.rarity))].sort());
 opts($('fin'),'Finish',[...new Set(base.map(c=>c.finish))].sort());
 const q=$('q').value.toLowerCase();
 base=base.filter(c=>(!$('typ').value||($('typ').value==='promo')===c.promo)&&(!$('rar').value||c.rarity===$('rar').value)&&(!$('fin').value||c.finish===$('fin').value)&&(!q||(c.name+c.set+c.number+c.rarity).toLowerCase().includes(q)));
 const own=base.filter(c=>owned[c.id]),need=base.filter(c=>!owned[c.id]);
 const sum=a=>a.reduce((t,c)=>t+usd(c),0);
 $('stats').innerHTML=`<div class="stat"><b>${own.length}/${base.length}</b><span>Owned</span></div><div class="stat"><b>~$${sum(own).toFixed(0)}</b><span>Collection value</span></div><div class="stat"><b>~$${sum(need).toFixed(0)}</b><span>To complete</span></div>`;
 $('pb').style.width=(base.length?own.length/base.length*100:0)+'%';
 let list=S.view==='own'?own:S.view==='need'?need:base;
 const so=$('sort').value,chg=c=>c.prev_price&&c.price?c.price-c.prev_price:0;
 list=[...list].sort((a,b)=>so==='price-a'?usd(a)-usd(b):so==='num'?a.number.localeCompare(b.number,undefined,{numeric:true}):so==='chg'?Math.abs(chg(b))-Math.abs(chg(a)):usd(b)-usd(a));
 updateBar();
 $('sum').textContent=`${list.length} cards shown`+(S.view==='need'?` · total ~$${sum(list).toFixed(0)}`:'');
 $('grid').innerHTML=list.length?'':'<div class="empty">No cards match.</div>';
 for(const c of list){
  const d=chg(c),el=document.createElement('div');el.className='card'+(owned[c.id]?' own':'');
  el.innerHTML=`<img loading="lazy" referrerpolicy="no-referrer" src="${c.image}" alt=""><div class="tick">${owned[c.id]?'✓':'+'}</div><div class="info"><div class="n">${c.character}${c.variant!=='Standard'?' · '+c.variant:''}</div><div class="m">${c.number} · ${c.set}</div><div class="m"><span class="tag">${c.lang}</span>${c.promo?'<span class="tag">Promo</span>':''}${c.imageApprox?'<span class="tag" title="Picture found via Google; may not be the exact version">~img</span>':''}<span class="tag">${c.rarity}</span><span class="tag">${c.finish}</span></div><div class="price">${money(c.price,c.currency)} ${d?`<small class="${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d).toFixed(2)}</small>`:''}</div>${owned[c.id]&&paid[c.id]?`<div class="m">Paid ${fmtPaid(paid[c.id])}</div>`:''}</div>`;
  el.onclick=()=>{if(owned[c.id])return cardModal(c);owned[c.id]=1;save();render()};
  $('grid').append(el)}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
['q','typ','rar','fin','sort'].forEach(i=>$(i).oninput=render);
fetch('data/cards.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{DATA=d;$('upd').textContent='prices '+d.updated;acct();render();if(user)pull()}).catch(()=>$('grid').innerHTML='<div class="empty">Could not load data/cards.json</div>');
</script></body></html>
